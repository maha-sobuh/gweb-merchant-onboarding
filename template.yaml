AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Phase 1 foundation for serverless merchant onboarding.
  Compute is Lambda-only. Table name, log level, and internal timeout
  come from parameters / environment — nothing is hardcoded in code.

Parameters:
  TableName:
    Type: String
    Default: MerchantOnboarding
    Description: DynamoDB single-table name
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
  InternalTimeoutSeconds:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 26
    Description: Handler DeadlineGuard budget; must stay below Lambda Timeout (28s), which itself stays below API Gateway REST API's fixed 29s integration timeout.

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    Timeout: 28
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref ApplicationsTable
        LOG_LEVEL: !Ref LogLevel
        DOCUMENTS_BUCKET: !Ref DocumentsBucket
        INTERNAL_TIMEOUT_SECONDS: !Ref InternalTimeoutSeconds
    Tracing: Active

Resources:
  MerchantOnboardingApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Idempotency-Key'"
        AllowOrigin: "'*'"

  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: MerchantOnboarding
        - Key: Phase
          Value: "1"

  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  CreateApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-applications-create"
      CodeUri: src/
      Handler: handlers.applications_create.handler
      Description: POST /applications — create METADATA + optional idempotency record
      Events:
        CreateApplication:
          Type: Api
          Properties:
            RestApiId: !Ref MerchantOnboardingApi
            Path: /applications
            Method: POST
      Policies:
        - Statement:
            - Sid: CreateApplicationDynamoDB
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt ApplicationsTable.Arn

  GetApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-applications-get"
      CodeUri: src/
      Handler: handlers.applications_get.handler
      Description: GET /applications/{id} — GetItem METADATA only
      Events:
        GetApplication:
          Type: Api
          Properties:
            RestApiId: !Ref MerchantOnboardingApi
            Path: /applications/{id}
            Method: GET
      Policies:
        - Statement:
            - Sid: GetApplicationDynamoDB
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt ApplicationsTable.Arn

  UpdateApplicantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-applicant-update"
      CodeUri: src/
      Handler: handlers.applicant_update.handler
      Description: PATCH /applications/{id}/applicant — upsert one person record
      Events:
        UpdateApplicant:
          Type: Api
          Properties:
            RestApiId: !Ref MerchantOnboardingApi
            Path: /applications/{id}/applicant
            Method: PATCH
      Policies:
        - Statement:
            - Sid: UpdateApplicantDynamoDB
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ApplicationsTable.Arn
  
  UpdateBusinessFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-business-update"
      CodeUri: src/
      Handler: handlers.business_update.handler
      Description: PATCH /applications/{id}/business — upsert the business record
      Events:
        UpdateBusiness:
          Type: Api
          Properties:
            RestApiId: !Ref MerchantOnboardingApi
            Path: /applications/{id}/business
            Method: PATCH
      Policies:
        - Statement:
            - Sid: UpdateBusinessDynamoDB
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ApplicationsTable.Arn

  PresignDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-documents-presign"
      CodeUri: src/
      Handler: handlers.documents_presign.handler
      Description: POST /applications/{id}/documents/presign - restricted S3 upload URL
      Events:
        PresignDocument:
          Type: Api
          Properties:
            RestApiId: !Ref MerchantOnboardingApi
            Path: /applications/{id}/documents/presign
            Method: POST
      Policies:
        - Statement:
            - Sid: PresignDocumentDynamoDB
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ApplicationsTable.Arn
            - Sid: PresignDocumentS3
              Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${DocumentsBucket.Arn}/applications/*"

Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${MerchantOnboardingApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  TableName:
    Description: DynamoDB table name
    Value: !Ref ApplicationsTable
  DocumentsBucketName:
    Description: S3 bucket for uploaded documents
    Value: !Ref DocumentsBucket
